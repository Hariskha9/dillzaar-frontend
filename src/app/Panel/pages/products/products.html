<div class="space-y-6 font-sans text-gray-200">
  
  <!-- Breadcrumb & Top Bar -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <div class="text-xs text-gray-400 mb-1">
        <span>Dashboard</span> <span class="mx-1">/</span> <span class="text-white">Products</span>
      </div>
      <h1 class="text-3xl font-serif font-bold text-white tracking-wide">Products</h1>
    </div>

    <!-- Actions / Controls -->
    <div class="flex items-center space-x-3">
      <button class="bg-[#1e1e1e] hover:bg-[#2a2a2a] text-gray-300 px-3 py-2 text-xs font-semibold tracking-wider uppercase border border-[#2d2d2d] transition-colors">
        Filters
      </button>
      <button class="bg-[#1e1e1e] hover:bg-[#2a2a2a] text-gray-300 px-3 py-2 text-xs font-semibold tracking-wider uppercase border border-[#2d2d2d] transition-colors">
        Columns
      </button>
      <button routerLink="/admin/products/create" class="bg-white hover:bg-white text-[#2a2a2a] px-4 py-2 text-xs font-semibold tracking-wider uppercase transition-colors">
        Create New
      </button>
    </div>
  </div>

  <!-- Search Input Bar -->
  <div class="bg-[#1e1e1e] border border-[#2d2d2d] p-4 flex items-center justify-between">
    <div class="relative w-full max-w-sm">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input 
        type="text" 
        placeholder="Search..." 
        class="w-full bg-[#161616] border border-[#2d2d2d] rounded-none pl-10 pr-4 py-2 text-xs text-white focus:outline-none focus:border-gray-500 transition-colors"
      />
    </div>
  </div>

  <!-- Products Table -->
  <div class="bg-[#1e1e1e] border border-[#2d2d2d] overflow-hidden shadow-sm">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead class="bg-[#161616] text-gray-400 uppercase tracking-wider border-b border-[#2d2d2d]">
          <tr>
            <th class="py-3 px-4 w-10">
              <input type="checkbox" class="rounded bg-[#2a2a2a] border-[#3d3d3d] text-blue-600 focus:ring-0 cursor-pointer">
            </th>
            <th class="py-3 px-4">Name</th>
            <th class="py-3 px-4">Sku</th>
            <th class="py-3 px-4">Price</th>
            <th class="py-3 px-4">Stock</th>
            <th class="py-3 px-4">Active</th>
            <th class="py-3 px-4 text-center">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#2d2d2d]">
          <tr *ngFor="let product of products" class="hover:bg-[#252525] transition-colors">
            
            <!-- Checkbox -->
            <td class="py-3 px-4">
              <input type="checkbox" class="rounded bg-[#2a2a2a] border-[#3d3d3d] text-blue-600 focus:ring-0 cursor-pointer">
            </td>
            
            <!-- Name Column with Image Thumbnail Before Name -->
            <td class="py-3 px-4">
              <div class="flex items-center space-x-3">
                <img 
                  [src]="product.image" 
                  [alt]="product.name" 
                  class="w-9 h-11 object-cover rounded bg-[#2a2a2a] border border-[#3d3d3d] flex-shrink-0"
                />
                <span 
                  class="font-medium text-white underline cursor-pointer hover:text-gray-300" 
                  (click)="onView(product)">
                  {{ product.name }}
                </span>
              </div>
            </td>

            <td class="py-3 px-4 text-gray-300">{{ product.sku }}</td>
            <td class="py-3 px-4 text-gray-300">{{ product.price }}</td>
            <td class="py-3 px-4 text-gray-300">{{ product.stock }}</td>
            
            <!-- Active Status -->
            <td class="py-3 px-4">
              <span class="bg-emerald-950/50 text-emerald-400 border border-emerald-800/40 px-2 py-0.5 text-[10px] font-medium rounded uppercase">
                {{ product.active }}
              </span>
            </td>
            
            <!-- Actions Column: View, Edit, Delete Buttons -->
            <td class="py-3 px-4 text-center">
              <div class="flex items-center justify-center space-x-2">
                <!-- View Button -->
                <button 
                  (click)="onView(product)" 
                  title="View Product"
                  class="p-1.5 bg-[#2a2a2a] hover:bg-blue-900 text-gray-300 hover:text-white rounded transition-colors">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>

                <!-- Edit Button -->
                <button 
                  (click)="onEdit(product)" 
                  title="Edit Product"
                  class="p-1.5 bg-[#2a2a2a] hover:bg-amber-900 text-gray-300 hover:text-white rounded transition-colors">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"></path>
                  </svg>
                </button>

                <!-- Delete Button -->
                <button 
                  (click)="onDelete(product)" 
                  title="Delete Product"
                  class="p-1.5 bg-[#2a2a2a] hover:bg-rose-900 text-gray-300 hover:text-white rounded transition-colors">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"></path>
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Table Footer / Pagination -->
    <div class="p-4 bg-[#161616] border-t border-[#2d2d2d] flex items-center justify-between text-xs text-gray-400">
      <div>1-6 of 6</div>
      <div class="flex items-center space-x-2">
        <span>Per page:</span>
        <select class="bg-[#1e1e1e] border border-[#2d2d2d] text-white px-2 py-1 rounded focus:outline-none">
          <option>10</option>
          <option>25</option>
          <option>50</option>
        </select>
      </div>
    </div>
  </div>

</div>
