<div class="flex min-h-screen bg-[#121212] font-sans text-gray-200">
  
  <!-- Main Form Content Area -->
  <div class="flex-1 p-8 space-y-6 max-w-7xl mx-auto transition-all">
    
    <!-- Breadcrumb & Top Bar -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-[#2d2d2d] pb-6">
      <div>
        <div class="text-xs text-gray-400 mb-1">
          <span>Dashboard</span> <span class="mx-1">/</span> 
          <a routerLink="/admin/products" class="hover:text-white underline">Products</a> <span class="mx-1">/</span> 
          <span class="text-white">Edit Product</span>
        </div>
        <h1 class="text-3xl font-serif font-bold text-white tracking-wide">Edit Product</h1>
      </div>
      <div>
        <button 
          type="button" 
          (click)="onUpdate()"
          class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 text-xs font-semibold tracking-wider uppercase transition-colors rounded">
          Update Changes
        </button>
      </div>
    </div>

    <!-- 2-Column Form Layout -->
    <form [formGroup]="productForm" (ngSubmit)="onUpdate()" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Left Column: General, Pricing, Gallery -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- General Information Box -->
        <div class="bg-[#1e1e1e] border border-[#2d2d2d] p-6 rounded shadow-sm space-y-4">
          <h3 class="text-sm font-semibold text-white uppercase tracking-wider border-b border-[#2d2d2d] pb-3">General Information</h3>
          
          <div>
            <label class="block text-xs font-semibold tracking-wider text-gray-300 uppercase mb-2">Product Name *</label>
            <input type="text" formControlName="name" class="w-full bg-[#161616] border border-[#2d2d2d] rounded px-4 py-2.5 text-xs text-white focus:outline-none" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold tracking-wider text-gray-300 uppercase mb-2">Slug *</label>
              <input type="text" formControlName="slug" class="w-full bg-[#161616] border border-[#2d2d2d] rounded px-4 py-2.5 text-xs text-white focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold tracking-wider text-gray-300 uppercase mb-2">SKU *</label>
              <input type="text" formControlName="sku" class="w-full bg-[#161616] border border-[#2d2d2d] rounded px-4 py-2.5 text-xs text-white focus:outline-none" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold tracking-wider text-gray-300 uppercase mb-2">Description</label>
            <textarea rows="5" formControlName="description" class="w-full bg-[#161616] border border-[#2d2d2d] rounded p-4 text-xs text-white focus:outline-none"></textarea>
          </div>
        </div>

        <!-- Pricing Box -->
        <div class="bg-[#1e1e1e] border border-[#2d2d2d] p-6 rounded shadow-sm space-y-4">
          <h3 class="text-sm font-semibold text-white uppercase tracking-wider border-b border-[#2d2d2d] pb-3">Pricing</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Regular Price (PKR) *</label>
              <input type="number" formControlName="regularPrice" class="w-full bg-[#161616] border border-[#2d2d2d] rounded px-4 py-2.5 text-xs text-white focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Sale Price (PKR)</label>
              <input type="number" formControlName="salePrice" class="w-full bg-[#161616] border border-[#2d2d2d] rounded px-4 py-2.5 text-xs text-white focus:outline-none" />
            </div>
          </div>
        </div>

        <!-- Product Gallery Images -->
        <div class="bg-[#1e1e1e] border border-[#2d2d2d] p-6 rounded shadow-sm space-y-4">
          <h3 class="text-sm font-semibold text-white uppercase tracking-wider border-b border-[#2d2d2d] pb-3">Product Gallery Images</h3>
          
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div *ngFor="let imgUrl of galleryImages; let i = index" class="relative w-full h-32 bg-black rounded border border-[#3d3d3d] overflow-hidden group">
              <img [src]="imgUrl" class="w-full h-full object-cover" />
              <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                <button type="button" (click)="removeGalleryImage(i)" class="bg-rose-600 text-white p-1.5 rounded text-xs">Remove</button>
              </div>
            </div>

            <div 
              (click)="openGalleryMediaDrawer()" 
              class="border border-dashed border-[#3d3d3d] bg-[#161616] h-32 rounded flex flex-col items-center justify-center cursor-pointer hover:border-gray-400 text-center p-2">
              <svg class="w-6 h-6 text-gray-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
              <span class="text-[11px] text-gray-300 font-medium">Add Gallery Image</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Right Column: Publish, Inventory, Category, Featured Image -->
      <div class="space-y-6">
        
        <!-- Publish Box -->
        <div class="bg-[#1e1e1e] border border-[#2d2d2d] p-6 rounded shadow-sm space-y-4">
          <h3 class="text-sm font-semibold text-white uppercase tracking-wider border-b border-[#2d2d2d] pb-3">Publish</h3>
          <div class="flex items-center space-x-3">
            <input type="checkbox" id="active" formControlName="active" class="w-4 h-4 rounded bg-[#161616] border-[#3d3d3d] text-blue-600" />
            <label for="active" class="text-xs font-semibold text-gray-300 uppercase cursor-pointer">Active / Visible</label>
          </div>
        </div>

        <!-- Category Box -->
        <div class="bg-[#1e1e1e] border border-[#2d2d2d] p-6 rounded shadow-sm space-y-4">
          <h3 class="text-sm font-semibold text-white uppercase tracking-wider border-b border-[#2d2d2d] pb-3">Category</h3>
          <select formControlName="category" class="w-full bg-[#161616] border border-[#2d2d2d] rounded px-4 py-2.5 text-xs text-white focus:outline-none">
            <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
          </select>
        </div>

        <!-- Inventory Box -->
        <div class="bg-[#1e1e1e] border border-[#2d2d2d] p-6 rounded shadow-sm space-y-4">
          <h3 class="text-sm font-semibold text-white uppercase tracking-wider border-b border-[#2d2d2d] pb-3">Inventory</h3>
          <div>
            <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Stock Quantity</label>
            <input type="number" formControlName="stock" class="w-full bg-[#161616] border border-[#2d2d2d] rounded px-4 py-2.5 text-xs text-white focus:outline-none" />
          </div>
        </div>

        <!-- Featured Image Box -->
        <div class="bg-[#1e1e1e] border border-[#2d2d2d] p-6 rounded shadow-sm space-y-4">
          <h3 class="text-sm font-semibold text-white uppercase tracking-wider border-b border-[#2d2d2d] pb-3">Featured Image</h3>
          
          <input type="file" #featuredDesktopInput (change)="onFeaturedDesktopFileSelected($event)" accept="image/*" class="hidden" />

          <div *ngIf="featuredImagePreview; else featuredPrompt" class="relative w-full h-44 bg-black rounded border border-[#3d3d3d] overflow-hidden group">
            <img [src]="featuredImagePreview" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
              <button type="button" (click)="removeFeaturedImage()" class="bg-rose-600 text-white px-3 py-1.5 rounded text-xs">Remove</button>
            </div>
          </div>

          <ng-template #featuredPrompt>
            <div class="border border-dashed border-[#3d3d3d] bg-[#161616] p-4 rounded text-center space-y-3">
              <div class="flex items-center justify-center gap-2">
                <button type="button" (click)="featuredDesktopInput.click()" class="bg-[#2a2a2a] text-gray-200 px-3 py-1.5 text-xs rounded border border-[#3d3d3d]">Upload New</button>
                <span class="text-xs text-gray-500">or</span>
                <button type="button" (click)="openFeaturedMediaDrawer()" class="bg-[#2a2a2a] text-gray-200 px-3 py-1.5 text-xs rounded border border-[#3d3d3d]">Choose Media</button>
              </div>
            </div>
          </ng-template>
        </div>

      </div>

    </form>
  </div>


  <!-- ================= SIDE DRAWER: CREATE NEW MEDIA ================= -->
  <div *ngIf="activeDrawer === 'create-media'" class="w-full lg:w-[500px] bg-[#181818] border-l border-[#2d2d2d] flex flex-col h-screen sticky top-0 shadow-2xl z-50">
    <div class="h-16 flex items-center justify-between px-6 border-b border-[#2d2d2d]">
      <div class="flex items-center space-x-2 text-xs text-gray-400">
        <button (click)="activeDrawer = 'select-media'" class="hover:text-white">&lsaquo;</button>
        <span class="text-white font-medium">Creating new Media</span>
      </div>
      <button type="button" (click)="saveNewMedia()" class="bg-blue-600 text-white px-4 py-1.5 text-xs font-semibold uppercase rounded">Save</button>
    </div>

    <div class="flex-1 p-6 space-y-6 overflow-y-auto">
      <div>
        <input type="file" #drawerFileInput (change)="onDrawerFileSelected($event)" accept="image/*" class="hidden" />
        <div *ngIf="newMediaPreview; else drawerDropzone" class="w-full h-56 bg-black rounded border border-[#3d3d3d] relative overflow-hidden">
          <img [src]="newMediaPreview" class="w-full h-full object-contain" />
          <button (click)="newMediaPreview = null" class="absolute top-2 right-2 bg-rose-600 text-white p-1 rounded text-xs">Change</button>
        </div>
        <ng-template #drawerDropzone>
          <div (click)="drawerFileInput.click()" class="border border-dashed border-[#3d3d3d] bg-[#161616] h-56 rounded flex flex-col items-center justify-center cursor-pointer hover:border-gray-400 text-center p-4">
            <span class="bg-[#2a2a2a] text-gray-200 px-3 py-1.5 text-xs rounded border border-[#3d3d3d] mb-2">Select a file</span>
            <span class="text-xs text-gray-500">or drag and drop a file</span>
          </div>
        </ng-template>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Alt *</label>
        <input type="text" [(ngModel)]="newMediaAlt" [ngModelOptions]="{standalone: true}" class="w-full bg-[#161616] border border-[#2d2d2d] rounded px-4 py-2.5 text-xs text-white focus:outline-none" />
      </div>
    </div>
  </div>


  <!-- ================= SIDE DRAWER: SELECT EXISTING MEDIA ================= -->
  <div *ngIf="activeDrawer === 'select-media'" class="w-full lg:w-[700px] bg-[#181818] border-l border-[#2d2d2d] flex flex-col h-screen sticky top-0 shadow-2xl z-50">
    <div class="h-16 flex items-center justify-between px-6 border-b border-[#2d2d2d]">
      <div class="flex items-center space-x-2 text-xs text-gray-400">
        <button (click)="closeDrawer()" class="hover:text-white">&lsaquo;</button>
        <span class="text-white font-medium">Media Library</span>
      </div>
      <button type="button" (click)="openCreateMediaDrawer()" class="bg-blue-600 text-white px-4 py-1.5 text-xs font-semibold uppercase rounded">Create New</button>
    </div>

    <div class="flex-1 overflow-y-auto">
      <table class="w-full text-left text-xs">
        <thead class="bg-[#161616] text-gray-400 uppercase tracking-wider border-b border-[#2d2d2d]">
          <tr>
            <th class="py-3 px-4">File Name</th>
            <th class="py-3 px-4">Alt</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#2d2d2d]">
          <tr *ngFor="let media of existingMediaItems" (click)="selectExistingMedia(media)" class="hover:bg-[#252525] cursor-pointer transition-colors">
            <td class="py-3 px-4 flex items-center space-x-2">
              <img [src]="media.url" class="w-8 h-8 object-cover rounded bg-black" />
              <span class="text-white underline">{{ media.fileName }}</span>
            </td>
            <td class="py-3 px-4 text-gray-300">{{ media.alt }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="p-4 bg-[#161616] border-t border-[#2d2d2d] flex justify-end">
      <button (click)="closeDrawer()" class="bg-[#2a2a2a] text-gray-300 px-4 py-2 text-xs rounded">Cancel</button>
    </div>
  </div>

</div>
