<aside class="w-64 h-full bg-[#1e1e1e] text-gray-300 font-sans flex flex-col border-r border-[#2d2d2d] select-none">
  
  <!-- Sidebar Header / Logo -->
  <div class="h-16 flex items-center justify-between px-6 border-b border-[#2d2d2d]">
    <span class="font-serif tracking-widest text-lg font-bold text-white uppercase">DillZaar</span>
    <!-- Close button for mobile screens inside the sidebar -->
    <button (click)="onNavClick()" class="lg:hidden text-gray-400 hover:text-white focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Navigation Scroll Area -->
  <div class="flex-1 py-6 px-4 space-y-6 overflow-y-auto">
    <div *ngFor="let section of navSections" class="space-y-2">
      <h3 class="text-xs font-semibold uppercase tracking-wider text-white bg-[#303030] py-3 px-3">
        {{ section.title }}
      </h3>
      
      <div *ngIf="section.items.length > 0" class="space-y-1 mt-1">
        <a 
          *ngFor="let item of section.items"
          [routerLink]="item.route"
          routerLinkActive="bg-[#3b4252] text-white font-medium shadow-sm"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onNavClick()"
          class="block px-3 py-2 rounded-md text-sm text-gray-400 hover:text-white hover:bg-[#2a2a2a] transition-all duration-150">
          {{ item.label }}
        </a>
      </div>
    </div>
  </div>

  <!-- Sidebar Footer -->
  <div class="p-4 border-t border-[#2d2d2d] text-xs text-gray-500">
    Admin Control Panel
  </div>
</aside>
