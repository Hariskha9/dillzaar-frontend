<div class="min-h-screen bg-[#121212] flex font-sans text-gray-200">
  
  <!-- Mobile Sidebar Overlay -->
  <div 
    *ngIf="isSidebarOpen" 
    class="fixed inset-0 bg-black/60 z-40 lg:hidden transition-opacity" 
    (click)="closeSidebar()">
  </div>

  <!-- Responsive Sidebar Component Wrapper -->
  <div 
    [ngClass]="isSidebarOpen ? 'translate-x-0' : '-translate-x-full'"
    class="fixed inset-y-0 left-0 z-50 w-64 transition-transform duration-300 ease-in-out lg:translate-x-0">
    <app-sidenav (linkClicked)="closeSidebar()"></app-sidenav>
  </div>

  <!-- Main Content Panel Area -->
  <div class="flex-1 flex flex-col lg:pl-64">
    
    <!-- Top Header Bar -->
    <header class="h-16 bg-[#1e1e1e] border-b border-[#2d2d2d] flex items-center justify-between px-4 sm:px-8 sticky top-0 z-30">
      
      <!-- Mobile Menu Trigger -->
      <button 
        (click)="toggleSidebar()" 
        class="lg:hidden text-gray-300 hover:text-white focus:outline-none p-1"
        aria-label="Toggle Sidebar">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <!-- Breadcrumb / Title -->
      <div class="hidden sm:flex items-center text-sm text-gray-400">
        <span>Dashboard / Panel</span>
      </div>

      <!-- User Profile Action -->
      <div class="flex items-center space-x-4">
        <div class="text-xs text-right">
          <span class="block font-medium text-gray-200">Store Admin</span>
          <span class="text-gray-400 text-[10px]">admin@zarqash.com</span>
        </div>
        <div class="w-9 h-9 rounded-full bg-neutral-700 flex items-center justify-center text-white font-semibold text-sm">
          ZA
        </div>
      </div>
    </header>

    <!-- Panel Body Dynamic Router Outlet -->
    <main class="flex-1 p-6 sm:p-10 bg-[#121212] overflow-y-auto">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>

</div>
