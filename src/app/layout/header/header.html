<header class="w-full bg-white sticky top-0 z-50 shadow-sm font-sans">
  <!-- Announcement Bar -->
  <div class="bg-black text-white text-center py-2 text-xs tracking-widest font-medium uppercase px-4">
    COMPLIMENTARY DELIVERY ACROSS PAKISTAN ON ORDERS ABOVE PKR 5,000
  </div>

  <!-- Main Header Navigation -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    
    <!-- Left: Mobile Hamburger & Desktop Nav Links -->
    <div class="flex items-center space-x-6">
      <!-- Mobile Menu Trigger -->
      <button 
        (click)="toggleMobileMenu()" 
        class="lg:hidden text-black focus:outline-none p-1"
        aria-label="Toggle Menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <!-- Desktop Nav Links (Left side of brand as seen in desktop view) -->
      <nav class="hidden lg:flex items-center space-x-8 text-xs font-semibold tracking-widest text-gray-900">
        <a *ngFor="let item of navItems | slice:0:4" [routerLink]="item.route" class="hover:text-gray-500 transition-colors">
          {{ item.label }}
        </a>
      </nav>
    </div>

    <!-- Center: Brand Logo -->
    <div class="absolute left-1/2 transform -translate-x-1/2 text-center">
      <a routerLink="/" class="inline-block">
        <h1 class="text-2xl sm:text-3xl font-serif tracking-[0.25em] font-bold text-black uppercase">
          DillZaar
        </h1>
        <span class="block text-[9px] tracking-[0.3em] font-medium text-gray-800 uppercase mt-[-2px]">
          LAHORE &bull; PAKISTAN
        </span>
      </a>
    </div>

    <!-- Right: Icons (Search, Profile, Cart) -->
    <div class="flex items-center space-x-5 sm:space-x-6">
      <!-- Search Icon -->
      <button class="text-black hover:text-gray-600 focus:outline-none" aria-label="Search">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <!-- User Account Icon (Hidden on desktop if inside main nav, visible on mobile right) -->
      <a routerLink="/account" class="hidden sm:block text-black hover:text-gray-600 focus:outline-none" aria-label="Account">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
      </a>

      <!-- Cart Icon with Badge -->
      <a routerLink="/cart" class="relative text-black hover:text-gray-600 focus:outline-none" aria-label="Cart">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
        </svg>
        <span class="absolute -top-2 -right-2 bg-black text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">
          {{ cartItemCount }}
        </span>
      </a>
    </div>
  </div>

  <!-- Mobile Drawer Overlay -->
  <div *ngIf="isMobileMenuOpen" class="fixed inset-0 bg-black bg-opacity-50 z-50 transition-opacity" (click)="toggleMobileMenu()"></div>

  <!-- Mobile Slide-out Menu -->
  <div class="fixed top-0 left-0 bottom-0 w-4/5 max-w-sm bg-white z-50 shadow-xl transform transition-transform duration-300 ease-in-out flex flex-col"
       [ngClass]="isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'">
    
    <!-- Drawer Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <h2 class="text-xl font-serif tracking-[0.2em] font-bold text-black">DillZaar</h2>
      <button (click)="toggleMobileMenu()" class="text-black focus:outline-none p-1" aria-label="Close Menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Drawer Links -->
    <div class="flex-1 overflow-y-auto py-4 px-6 space-y-4">
      <a *ngFor="let item of navItems" 
         [routerLink]="item.route" 
         (click)="toggleMobileMenu()"
         class="flex items-center justify-between py-3 border-b border-gray-100 text-xs font-semibold tracking-wider text-gray-900 hover:text-gray-500">
        <span>{{ item.label }}</span>
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </div>

    <!-- Drawer Footer -->
    <div class="p-6 border-t border-gray-200 text-center">
      <p class="text-[10px] tracking-widest text-gray-500 uppercase">MADE WITH PRIDE IN PAKISTAN</p>
    </div>
  </div>
</header>
