
<aside aria-label="Product Filters" class="space-y-8">

  <!-- Category -->
  <div>
    <h2 class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-900">
      CATEGORY
    </h2>

    <div class="mt-4 space-y-2.5 text-xs text-neutral-700">

      <label class="flex items-center gap-2.5 cursor-pointer">
        <input
          type="radio"
          name="categoryFilter"
          [checked]="draftCategory() === 'all'"
          (change)="onCategorySelect('all')"
          class="h-3.5 w-3.5 accent-neutral-900 cursor-pointer"
        />
        <span>All</span>
      </label>

      @for (cat of categories(); track cat.slug) {
        <label class="flex items-center gap-2.5 cursor-pointer">
          <input
            type="radio"
            name="categoryFilter"
            [checked]="draftCategory() === cat.slug"
            (change)="onCategorySelect(cat.slug)"
            class="h-3.5 w-3.5 accent-neutral-900 cursor-pointer"
          />
          <span>{{ cat.name }}</span>
        </label>
      }
    </div>
  </div>

  <!-- Fabric -->
  @if (fabrics().length > 0) {
    <div class="border-t border-neutral-200 pt-6">
      <h2 class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-900">
        FABRIC
      </h2>

      <div class="mt-4 space-y-2.5 text-xs text-neutral-700">

        <label class="flex items-center gap-2.5 cursor-pointer">
          <input
            type="radio"
            name="fabricFilter"
            [checked]="draftFabric() === 'all'"
            (change)="onFabricSelect('all')"
            class="h-3.5 w-3.5 accent-neutral-900 cursor-pointer"
          />
          <span>All</span>
        </label>

        @for (fab of fabrics(); track fab.id) {
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input
              type="radio"
              name="fabricFilter"
              [checked]="draftFabric() === fab.slug"
              (change)="onFabricSelect(fab.slug)"
              class="h-3.5 w-3.5 accent-neutral-900 cursor-pointer"
            />
            <span>{{ fab.name }}</span>
          </label>
        }
      </div>
    </div>
  }

  <!-- Price -->
  <div class="border-t border-neutral-200 pt-6">
    <h2 class="text-[10px] font-semibold uppercase tracking-[0.24em] text-neutral-900">
      PRICE
    </h2>

    <p class="mt-3 text-[11px] font-medium tracking-wide text-neutral-600">
      PKR 0 — {{ formatPkr(draftMaxPrice()) }}
    </p>

    <input
      type="range"
      min="1000"
      max="20000"
      step="500"
      [value]="draftMaxPrice()"
      (input)="onPriceInput($event)"
      aria-label="Maximum price filter"
      class="mt-3 w-full accent-neutral-900 cursor-pointer"
    />

    <div class="mt-5 flex flex-col gap-3">
      <button
        type="button"
        (click)="applyFilters()"
        class="w-full bg-neutral-900 px-5 py-3 text-[10px] font-semibold uppercase tracking-[0.2em] text-white hover:bg-neutral-700 transition cursor-pointer"
      >
        Apply Filters
      </button>

      <button
        type="button"
        (click)="resetDraftFilters()"
        class="text-[10px] font-medium uppercase tracking-[0.2em] text-neutral-500 underline underline-offset-4 hover:text-neutral-900 cursor-pointer"
      >
        Clear Selection
      </button>
    </div>
  </div>

</aside>
