<div class="group flex flex-col font-sans text-[#1a1a1a]">
  
  <!-- Image Container (3:4 Portrait Aspect Ratio) -->
  <a [routerLink]="['/product', product.slug]" class="relative block aspect-[3/4] w-full overflow-hidden bg-[#eae8e3]">
    <img 
      [src]="getProductImage(product.image)" 
      [alt]="product.name"
      class="w-full h-full object-cover object-center transition-transform duration-700 ease-out group-hover:scale-105"
    />

    <!-- Top-Right Circular Wishlist Button -->
    <button 
      type="button"
      (click)="onToggleWishlist($event)"
      aria-label="Add to wishlist"
      class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/95 hover:bg-white shadow-sm flex items-center justify-center transition-transform active:scale-95">
      <svg 
        class="w-4 h-4 transition-colors" 
        [ngClass]="product.isWishlisted ? 'fill-rose-600 text-rose-600' : 'fill-none text-gray-700'"
        stroke="currentColor" 
        viewBox="0 0 24 24" 
        stroke-width="1.6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
      </svg>
    </button>

    <!-- Bottom Hover Quick Add Bar -->
    <div class="absolute inset-x-3 bottom-3 opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300">
      <button 
        type="button"
        (click)="onQuickAdd($event)"
        class="w-full bg-white/95 hover:bg-white text-[#111] py-2.5 px-4 flex items-center justify-between text-[10px] font-semibold tracking-[0.18em] uppercase shadow-sm">
        <span>Quick Add</span> 
        <span class="text-sm leading-none font-normal">+</span> 
      </button>
    </div>
  </a>

  <!-- Centered Product Meta Below Image -->
  <div class="text-center pt-4 space-y-1">
    <p class="text-[9px] tracking-[0.2em] uppercase text-gray-400">
      {{ product.category }}
    </p>
    <h3 class="text-sm font-serif text-[#111]">
      <a [routerLink]="['/product', product.slug]" class="hover:underline">
        {{ product.name }} 
      </a>
    </h3>
    <p class="text-[11px] font-medium tracking-wider text-gray-700">
      {{ product.price }} 
    </p>
  </div>

</div>
