<section class="relative w-full h-[85vh] sm:h-[90vh] min-h-[550px] bg-neutral-900 flex items-center overflow-hidden font-sans">
  
  <!-- LCP Optimization: High-priority background image using an <img> tag for optimal browser painting & fetch priority -->
  <div class="absolute inset-0 z-0">
    <img 
      [src]="heroImage" 
      alt="Zarqash Lawn '25 - Rooted in Riwayat" 
      class="w-full h-full object-cover object-center brightness-[0.85]"
      fetchpriority="high"
      loading="eager"
      decoding="async"
    />
    <!-- Subtle Gradient Overlay to ensure typography readability -->
    <div class="absolute inset-0 bg-gradient-to-r from-black/60 via-black/20 to-transparent"></div>
  </div>

  <!-- Hero Content Container -->
  <div class="relative z-10 max-w-7xl mx-auto px-6 sm:px-10 lg:px-16 w-full flex flex-col items-start justify-center text-white">
    
    <!-- Subtitle / Tagline -->
    <div class="flex items-center space-x-3 mb-4">
      <span class="w-8 h-[1px] bg-white"></span>
      <span class="text-[10px] sm:text-xs tracking-[0.25em] font-medium uppercase text-gray-200">
        LAWN '25 &bull; DESIGNED IN LAHORE
      </span>
    </div>

    <!-- Main Headline -->
    <h1 class="text-4xl sm:text-6xl lg:text-7xl font-serif font-normal tracking-wide leading-[1.1] mb-6 max-w-xl">
      Rooted in <br/>
      <span class="italic">riwayat.</span>
    </h1>

    <!-- Description Paragraph -->
    <p class="text-xs sm:text-sm text-gray-200 font-light tracking-wide leading-relaxed max-w-md mb-8">
      Contemporary Pakistani silhouettes, intricate karigari, and a quiet expression of timeless elegance.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center space-y-3 sm:space-y-0 sm:space-x-4 w-full sm:w-auto">
      <!-- Primary CTA Button -->
      <a 
        routerLink="/shop-collection" 
        class="bg-white text-black hover:bg-black hover:text-white transition-all duration-300 py-4 px-8 text-xs font-semibold tracking-[0.2em] uppercase flex items-center justify-between sm:justify-center space-x-4 border border-white">
        <span>SHOP THE COLLECTION</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>

      <!-- Secondary CTA Button -->
      <a 
        routerLink="/ready-to-wear" 
        class="bg-transparent text-white hover:bg-white/10 transition-all duration-300 py-4 px-8 text-xs font-semibold tracking-[0.2em] uppercase text-center border border-white/60">
        READY TO WEAR
      </a>
    </div>

  </div>
</section>
<section class="w-full bg-white font-sans py-3 border-b border-gray-900">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-wrap items-center justify-center gap-x-8 gap-y-3 text-center">
      <ng-container *ngFor="let feature of features; let last = last">
        <!-- Feature Text -->
        <span class="text-[10px] font-semibold tracking-[0.25em] text-black uppercase">
          {{ feature.label }}
        </span>

        <!-- Diamond Separator (Hidden on the last item) -->
        <span *ngIf="!last" class="text-black text-[10px] hidden sm:inline" aria-hidden="true">
          &#9670;
        </span>
      </ng-container>
    </div>
  </div>
</section>
