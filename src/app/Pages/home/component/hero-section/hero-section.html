<section
  aria-label="Featured Collections"
  (mouseenter)="pause()"
  (mouseleave)="resume()"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
  class="relative w-full h-[85vh] min-h-[560px] max-h-[900px] overflow-hidden bg-neutral-950 select-none"
>

  @for (slide of slides; track slide.id; let idx = $index) {
    @if (idx === currentIndex()) {
      <div class="relative h-full w-full">
        <!-- Desktop / Laptop Image -->
        <img
          [src]="slide.desktopImage"
          [alt]="slide.alt"
          fetchpriority="high"
          loading="eager"
          class="hidden md:block h-full w-full object-cover object-center "
        />

        <!-- Mobile / Tablet Portrait Image -->
        <img
          [src]="slide.mobileImage"
          [alt]="slide.alt"
          fetchpriority="high"
          loading="eager"
          class="block md:hidden h-full w-full object-cover object-top"
        />

        <!-- Dark Overlay -->
        <div
          class="pointer-events-none absolute inset-0 z-10 bg-black/45"
        ></div>

        <!-- Text Overlay -->
        <div
          class="absolute inset-0 z-40 mx-auto flex h-full w-full max-w-7xl items-end md:items-center justify-center md:justify-end px-6 sm:px-12 pb-20 md:pb-0"
        >
          <div class="animate-smooth-text max-w-md text-center md:text-left text-white">
            <p class="text-[11px] font-normal uppercase tracking-[0.24em] text-neutral-200">
              {{ slide.eyebrow }}
            </p>

            <h2 class="mt-3 font-serif text-4xl sm:text-5xl lg:text-[54px] font-normal uppercase tracking-[0.1em] leading-[1.1] text-white">
              {{ slide.title }}
            </h2>

            <p class="mt-3 text-sm sm:text-base font-normal tracking-wide text-neutral-200">
              {{ slide.subtitle }}
            </p>

            <!-- <div class="mt-8">
              <a
                [routerLink]="slide.ctaRoute"
                class="inline-block border border-white/80 bg-black/40 px-7 py-3.5 text-[11px] font-medium uppercase tracking-[0.2em] text-white hover:bg-white hover:text-black transition-colors duration-300"
              >
                {{ slide.ctaLabel }}
              </a>
            </div> -->
          </div>
        </div>
      </div>
    }
  }

  <!-- Left Arrow -->
  <button
    type="button"
    (click)="prev()"
    aria-label="Previous slide"
    class="hidden sm:flex absolute left-5 lg:left-8 top-1/2 -translate-y-1/2 z-50 h-11 w-11 items-center justify-center border border-white/25 bg-black/20 text-white/80 hover:border-white hover:bg-black/50 hover:text-white transition-all cursor-pointer"
  >
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
    </svg>
  </button>

  <!-- Right Arrow -->
  <button
    type="button"
    (click)="next()"
    aria-label="Next slide"
    class="hidden sm:flex absolute right-5 lg:right-8 top-1/2 -translate-y-1/2 z-50 h-11 w-11 items-center justify-center border border-white/25 bg-black/20 text-white/80 hover:border-white hover:bg-black/50 hover:text-white transition-all cursor-pointer"
  >
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
    </svg>
  </button>

  <!-- Pagination Dots -->
  <div
    role="tablist"
    aria-label="Slide pagination"
    class="absolute bottom-7 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3"
  >
    @for (slide of slides; track slide.id; let idx = $index) {
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="idx === currentIndex()"
        [attr.aria-label]="'Go to slide ' + (idx + 1)"
        (click)="goTo(idx)"
        [class.w-8]="idx === currentIndex()"
        [class.bg-white]="idx === currentIndex()"
        [class.w-2.5]="idx !== currentIndex()"
        [class.bg-white/40]="idx !== currentIndex()"
        class="h-[2px] transition-all duration-300 hover:bg-white cursor-pointer"
      ></button>
    }
  </div>
</section>
